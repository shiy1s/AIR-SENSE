services:
  - type: web
    name: air-sense
    runtime: python
    plan: free
    branch: main
    buildCommand: apt-get update && apt-get install -y git-lfs && git lfs install && git lfs pull && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONUNBUFFERED
        value: "1"
